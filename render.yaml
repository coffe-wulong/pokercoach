services:
  - type: web
    name: poker-reviewer
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_LOGIN_CODE
        sync: false
      - key: ADMIN_OPENID
        value: admin-local
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: SEED_TEST_ACCOUNTS
        value: true
    disk:
      name: poker-reviewer-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
